services:
  - type: web
    name: med-emr
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci && npm run build && cd ..
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn emr.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      # Auto-generated — do not set manually
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Paste your Neon connection string (postgres://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: BLIND_INDEX_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Optional — set GEMINI_API_KEY to enable AI assistant (free at aistudio.google.com)
      - key: GEMINI_API_KEY
        sync: false
      # Optional — add a Render Redis add-on and paste its URL here for shared caching
      - key: REDIS_URL
        sync: false
