services:
  - type: web
    name: med-emr
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci && npm run build && cd ..
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn emr.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      # Auto-generated — do not set manually
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Paste your Neon connection string (postgres://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: BLIND_INDEX_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "med-emr.onrender.com"
      # Optional — set GEMINI_API_KEY to enable AI assistant (free at aistudio.google.com)
      - key: GEMINI_API_KEY
        sync: false
      # Shared caching across gunicorn workers via Render Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: med-redis
          property: connectionString
      # Number of reverse proxy hops in front of the app (Render edge proxy = 1)
      - key: TRUSTED_PROXY_COUNT
        value: "1"
    # Persistent disk for clinical documents and audit archives (C-08 remediation).
    # Prevents ephemeral disk wipeout on container restarts and deployments.
    # Note: Requires Render Starter plan ($7/mo) + Disk ($0.25/GB/mo).
    disk:
      name: med-media
      mountPath: /app/media
      sizeGB: 10

  - type: redis
    name: med-redis
    ipAllowList: [] # internal access only
    plan: starter
    maxmemoryPolicy: allkeys-lru

